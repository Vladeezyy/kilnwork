plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/kilnwork.accesswidener')
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.x: no obfuscation, no mappings, plain configurations (no mod* ones)
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_fabric_version}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'kilnwork-fabric'
            from components.java
        }
    }
}
